<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>مادر امروز</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f5f4;
         color: #16201e; font: 17px/1.7 Tahoma, "Vazirmatn", system-ui, sans-serif; }
  main { box-sizing: border-box; width: min(420px, calc(100% - 32px)); background: #fff; border-radius: 16px; padding: 28px 24px;
         box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
  .brand { color: #0b6b63; font-weight: 700; margin: 0 0 18px; }
  .week { font-size: 44px; font-weight: 700; margin: 0; color: #0b6b63; }
  .sub { color: #5a6865; margin: 4px 0 22px; }
  dl { display: grid; gap: 10px; margin: 0; text-align: right; }
  dl div { display: flex; justify-content: space-between; border-top: 1px solid #dde4e2; padding-top: 10px; }
  dt { color: #5a6865; } dd { margin: 0; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1513; color: #e2eae7; } main { background: #18211f; }
    .brand, .week { color: #4fc3b4; } .sub, dt { color: #97a5a1; } dl div { border-color: #26322f; }
  }
</style>
</head>
<body>
<main>
{% if view %}
  <p class="brand">مادر امروز</p>
  <p class="week">هفته {{ week }}</p>
  <p class="sub">بارداری{% if days %} و {{ days }} روز{% endif %}</p>
  <dl>
    <div><dt>تاریخ تقریبی زایمان</dt><dd>{{ due_date }}</dd></div>
    <div><dt>روزهای باقی‌مانده</dt><dd>{{ days_left }} روز</dd></div>
  </dl>
{% else %}
  <p class="brand">مادر امروز</p>
  <p>این کد فعال نیست.</p>
{% endif %}
</main>
</body>
</html>
